name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  release:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      # npm trusted publishing (OIDC): this permission is the credential.
      # The trusted publisher configured on npmjs.com must name this file (ci.yml)
      # and allow `npm publish`; there is no NPM_TOKEN anywhere.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # npm >= 11.5.1 exchanges the OIDC token itself at publish time;
      # @semantic-release/npm only uses OIDC for its auth check.
      # Never set `registry-url` on setup-node: the .npmrc auth placeholder it
      # writes shadows OIDC.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
